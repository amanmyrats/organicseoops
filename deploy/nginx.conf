# Loopback-only local HTTP proxy. Production TLS/hosts are a separate task.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    # Stream sensitive uploads to bounded application intake without body temp files.
    proxy_request_buffering off;
    # Django emits correlated URL-free request logs; do not duplicate raw query strings here.
    access_log off;

    # Resolve replacements of the API container without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location / {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
