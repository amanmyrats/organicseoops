# Only the private VPC TLS port is enabled; ACL credentials are a private file.
port 0
tls-port 6379
tls-cert-file /run/organicseoops/redis.crt
tls-key-file /run/organicseoops/redis.key
tls-ca-cert-file /run/organicseoops/redis-ca.pem
tls-auth-clients no
aclfile /run/organicseoops/redis.acl
protected-mode yes
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
