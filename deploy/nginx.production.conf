# ALB HTTPS listener to private EC2 port80, restricted at the security group.
# CloudFront's generated viewer address and viewer Host are required for browser paths.
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 10m;
    # Stream sensitive uploads to bounded application intake without body temp files.
    proxy_request_buffering off;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CloudFront-Viewer-Address;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location = /api/health/ {
        proxy_pass $api;
        # ALB health checks send the target IP as Host; keep Django's host allowlist exact.
        proxy_set_header Host api.organicseoops.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        if ($http_cloudfront_viewer_address = "") { return 403; }
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
