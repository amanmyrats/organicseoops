name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact runtimes
        run: |
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
      - run: npm ci --foreground-scripts
      - run: npm run check
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=high

  backend:
    uses: ./.github/workflows/backend-checks.yml
